services:
  - type: worker
    name: tg-telegram-userbot
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: SOURCE_CHAT_ID
        value: "-1004498861542"
      - key: WEB_ADMIN_API
        sync: false
      - key: WEB_ADMIN_API_TOKEN
        sync: false
      - key: API_SECRET
        sync: false
      - key: PORT
        value: "8080"
